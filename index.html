<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de Hábitos</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card-custom {
      max-width: 500px;
      width: 100%;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      background: #ffffff;
    }
    .habito-item {
      transition: all 0.2s ease-in-out;
      border-radius: 0.5rem !important;
      margin-bottom: 0.5rem;
    }
    .habito-completado {
      background-color: #d1e7dd !important;
      border-color: #badbcc !important;
      color: #0f5132;
    }
    .habito-texto-completado {
      text-decoration: line-through;
      opacity: 0.75;
    }
  </style>
</head>
<body class="p-3 p-md-4">

  <div class="card card-custom p-4">
    <h2 class="text-center fw-bold mb-4 d-flex align-items-center justify-content-center gap-2">
      <span>📝</span> Tablero de Hábitos
    </h2>

    <!-- Formulario para agregar hábitos -->
    <form id="form-habito" class="mb-4">
      <div class="input-group">
        <input 
          type="text" 
          id="input-habito" 
          class="form-control form-control-lg" 
          placeholder="Escribe un hábito..." 
          required
          autocomplete="off"
        >
        <button type="submit" class="btn btn-primary btn-lg px-4">Agregar</button>
      </div>
    </form>

    <!-- Lista dinámicamente poblada -->
    <ul id="lista-habitos" class="list-group list-group-flush"></ul>
  </div>

  <!-- JavaScript -->
  <script>
    // 1. Modelo de Datos inicial (arreglo de objetos)
    let habitos = [
      { id: Date.now(), nombre: "Beber 2L de agua", completado: false }
    ];

    // Referencias al DOM
    const formHabito = document.getElementById("form-habito");
    const inputHabito = document.getElementById("input-habito");
    const listaHabitos = document.getElementById("lista-habitos");

    // 2. Renderizado dinámico con Arrow Functions y Destructuring
    const renderizarHabitos = () => {
      listaHabitos.innerHTML = "";

      if (habitos.length === 0) {
        listaHabitos.innerHTML = `
          <li class="list-group-item text-center text-muted border-0 py-3">
            ¡No tienes hábitos registrados! Añade uno arriba.
          </li>
        `;
        return;
      }

      habitos.forEach(({ id, nombre, completado }) => {
        const li = document.createElement("li");
        
        // Asignar clases de Bootstrap según el estado
        li.className = `list-group-item d-flex justify-content-between align-items-center habito-item ${
          completado ? "habito-completado" : ""
        }`;
        li.dataset.id = id;

        // Inserción segura del contenido
        li.innerHTML = `
          <span class="${completado ? "habito-texto-completado" : "fw-medium"}">${nombre}</span>
          <div class="btn-group gap-1">
            <button class="btn btn-sm ${completado ? 'btn-success' : 'btn-outline-success'} btn-completar" title="Marcar como completado">
              <i class="bi bi-check-lg pointer-events-none"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger btn-eliminar" title="Eliminar hábito">
              <i class="bi bi-trash pointer-events-none"></i>
            </button>
          </div>
        `;

        listaHabitos.appendChild(li);
      });
    };

    // Agregar nuevo hábito
    const agregarHabito = (nombre) => {
      const nuevoHabito = {
        id: Date.now(),
        nombre: nombre.trim(),
        completado: false
      };
      habitos.push(nuevoHabito);
      renderizarHabitos();
    };

    // Evento Formulario
    formHabito.addEventListener("submit", (e) => {
      e.preventDefault();
      const texto = inputHabito.value;
      if (texto) {
        agregarHabito(texto);
        inputHabito.value = "";
      }
    });

    // 3. Delegación de eventos en el <ul> padre
    listaHabitos.addEventListener("click", (e) => {
      const botonCompletar = e.target.closest(".btn-completar");
      const botonEliminar = e.target.closest(".btn-eliminar");
      const li = e.target.closest("li");

      if (!li) return;
      const id = Number(li.dataset.id);

      // Manejo de marcar/desmarcar completado
      if (botonCompletar) {
        habitos = habitos.map(habito => 
          habito.id === id ? { ...habito, completado: !habito.completado } : habito
        );
        renderizarHabitos();
      }

      // Manejo de eliminar hábito
      if (botonEliminar) {
        habitos = habitos.filter(habito => habito.id !== id);
        renderizarHabitos();
      }
    });

    // Carga inicial
    document.addEventListener("DOMContentLoaded", renderizarHabitos);
  </script>
</body>
</html>
